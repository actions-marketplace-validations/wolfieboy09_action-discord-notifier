name: Discord Commit Webhook Notifier
description: Send notifications via Discord webhook.
branding:
  color: blue
  icon: message-square
inputs:
  webhook:
    description: A full discord webhook url
    required: true
  message-title:
    description: Message title
    required: false
  title-url:
    description: URL the embed title links to
    required: false
  header:
    description: Optional heading shown above the commit list
    required: false
  edit-message-id:
    description: ID of an existing webhook message to edit instead of posting a new one
    required: false
outputs:
  result:
    description: Webhook result
  commit-count:
    description: Number of commits in the push
  message-id:
    description: ID of the created Discord message
runs:
  using: node24
  main: dist/index.js